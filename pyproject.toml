[project]
name = "lertarot"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    {name = "Lucas Beneylton",email = "47756391+lbeneylton@users.noreply.github.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "uuid7 (>=0.1.0,<0.2.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
]



[tool.poetry]
name = "lertarot"
version = "0.1.0"
description="API da plataforma Ler Tarot"
authors = [
    {name = "Lucas Beneylton",email = "[lbeneylton@gmail.com]"}
]
packages = [
    { include = "app", from = "src" }
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
ruff = "^0.12.0"
httpx = "^0.28.0"
aiosqlite = "^0.22.1"

[tool.ruff]
src = ["src"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "pgsql", "site-packages", "alembic"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
